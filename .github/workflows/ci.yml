name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # mongodb-memory-server downloads MongoDB and starts a single-node replica set for the API tests.
      - run: npm test
      - run: npm test -w bridge
      - run: npm run build
