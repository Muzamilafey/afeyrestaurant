# Nginx site for Chili POS (single installation). Replace pos.example.co.ke with your domain.
# Certificates: sudo certbot --nginx -d pos.example.co.ke   (Let's Encrypt, auto-renewing)

upstream chili_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name pos.example.co.ke;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pos.example.co.ke;

    ssl_certificate     /etc/letsencrypt/live/pos.example.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.co.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 6m;   # product images / logo (API limit is 5 MB)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built web app (npm run build -w web → web/dist)
    root /opt/chili-pos/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://chili_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;     # Socket.IO (/api/v1/realtime)
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
    }

    location /uploads/ {
        proxy_pass http://chili_api;
        expires 7d;
    }

    # Service worker and manifest must never be cached long-term.
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }

    location / { try_files $uri /index.html; }
}
